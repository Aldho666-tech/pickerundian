<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Undian Monokrom Pro</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Canvas Confetti (Library untuk efek kertas warna-warni) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Kustomisasi Konfig Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'bounce-slow': 'bounce 3s infinite',
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Tambahan */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #000; }
        
        .cursor-wait { cursor: wait; }
        
        /* Modal Animation */
        .modal-enter { opacity: 0; transform: scale(0.9); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 0.3s, transform 0.3s; }
        .modal-exit { opacity: 1; transform: scale(1); }
        .modal-exit-active { opacity: 0; transform: scale(0.9); transition: opacity 0.3s, transform 0.3s; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-950 via-gray-800 to-black font-sans text-gray-800 selection:bg-gray-300">

    <!-- Audio Element untuk Suara Pemenang -->
    <!-- Menggunakan sound effect trumpet/tada yang umum -->
    <audio id="celebration-sound" src="https://www.soundjay.com/misc/sounds/magic-chime-01.mp3" preload="auto"></audio>

    <div class="p-4 md:p-8 relative z-10">
        <!-- Header -->
        <header class="max-w-6xl mx-auto mb-8 text-center text-white">
            <h1 class="text-4xl md:text-5xl font-black mb-2 flex items-center justify-center gap-3 tracking-tighter">
                <i data-lucide="gift" class="w-10 h-10 text-white"></i>
                UNDIAN UMROH BATARA PARKVIEW
            </h1>
        </header>

        <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- KOLOM KIRI: INPUT PESERTA -->
            <div class="lg:col-span-3 bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col h-[500px] lg:h-[600px] border border-gray-700">
                <div class="p-4 bg-black text-white border-b border-gray-800">
                    <h2 class="font-bold text-sm uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="users" class="w-4 h-4"></i>
                        Database Peserta (<span id="participant-count">0</span>)
                    </h2>
                </div>
                
                <!-- Form Tambah -->
                <form id="add-form" class="p-3 bg-gray-100 border-b border-gray-200 flex gap-2 shadow-inner">
                    <input
                        type="text"
                        id="new-entry"
                        placeholder="Ketik nama lalu Enter..."
                        class="flex-1 px-3 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-all bg-white"
                        autocomplete="off"
                    />
                    <button type="submit" class="bg-black text-white px-3 py-2 rounded hover:bg-gray-800 transition-colors">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                </form>

                <!-- Tombol Import Cepat (Opsional) -->
                <div class="px-3 py-2 bg-gray-50 text-xs text-center border-b border-gray-200">
                    <button onclick="addDummyData()" class="text-gray-500 hover:text-black hover:underline">
                        + Tambah 5 Contoh Nama
                    </button>
                </div>

                <!-- List -->
                <div id="participant-list" class="flex-1 overflow-y-auto p-2 space-y-1 bg-white">
                    <!-- Item akan muncul di sini -->
                    <div class="text-center text-gray-400 text-xs mt-20 px-4">
                        <i data-lucide="user-plus" class="w-8 h-8 mx-auto mb-2 opacity-30"></i>
                        <p>Belum ada peserta.</p>
                        <p>Silakan input nama manual.</p>
                    </div>
                </div>
            </div>

            <!-- KOLOM TENGAH: AREA UTAMA -->
            <div class="lg:col-span-5 flex flex-col gap-6">
                
                <!-- Kartu Display Utama -->
                <div class="bg-white rounded-2xl shadow-[0_0_40px_rgba(255,255,255,0.1)] p-6 text-center flex flex-col items-center justify-center min-h-[350px] relative overflow-hidden border border-gray-800">
                    <div class="absolute top-0 w-full h-1 bg-gradient-to-r from-black via-gray-500 to-black"></div>
                    
                    <h3 id="status-text" class="text-gray-400 uppercase tracking-[0.2em] text-xs font-bold mb-8">
                        SIAP UNTUK MENGUNDI
                    </h3>

                    <!-- Tampilan Rolling Nama -->
                    <div id="rolling-display" class="text-5xl md:text-6xl font-black mb-12 text-black tracking-tight min-h-[4rem] flex items-center justify-center">
                        ???
                    </div>

                    <!-- Input Jumlah Pemenang -->
                    <div class="flex items-center justify-center gap-3 mb-8 bg-gray-100 p-2 rounded-lg px-4">
                        <label class="text-xs font-bold text-gray-500 uppercase">Cari</label>
                        <input 
                            type="number" 
                            id="winner-count"
                            min="1" 
                            value="1"
                            class="w-16 text-center bg-white border border-gray-300 rounded py-1 font-bold text-lg focus:outline-none focus:border-black"
                        />
                        <span class="text-xs font-bold text-gray-500 uppercase">Pemenang</span>
                    </div>

                    <!-- Tombol Kontrol -->
                    <div class="flex gap-3 w-full justify-center">
                        <button
                            id="reset-btn"
                            class="px-4 py-3 rounded-lg font-bold bg-gray-100 text-gray-600 hover:bg-gray-200 border border-gray-200 transition-all flex items-center gap-2 text-sm"
                        >
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Reset
                        </button>

                        <button
                            id="draw-btn"
                            class="flex-1 px-6 py-3 rounded-lg font-bold text-white shadow-xl flex items-center justify-center gap-2 transition-all transform hover:-translate-y-1 active:scale-95 bg-black hover:bg-gray-900 disabled:bg-gray-400 disabled:cursor-wait disabled:hover:translate-y-0"
                        >
                            <span id="btn-text" class="flex items-center gap-2">
                                <i data-lucide="shuffle" class="w-5 h-5"></i> MULAI UNDIAN
                            </span>
                        </button>
                    </div>
                </div>

                <!-- Statistik -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-gray-900 p-4 rounded-xl border border-gray-700 text-center shadow-lg">
                        <div id="stat-remaining" class="text-3xl font-bold text-white">0</div>
                        <div class="text-[10px] text-gray-400 uppercase tracking-widest mt-1">Sisa Peserta</div>
                    </div>
                    <div class="bg-gray-900 p-4 rounded-xl border border-gray-700 text-center shadow-lg">
                        <div id="stat-winners" class="text-3xl font-bold text-white">0</div>
                        <div class="text-[10px] text-gray-400 uppercase tracking-widest mt-1">Total Pemenang</div>
                    </div>
                </div>
            </div>

            <!-- KOLOM KANAN: RIWAYAT PEMENANG -->
            <div class="lg:col-span-4 bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col h-[500px] lg:h-[600px] border-2 border-black">
                <div class="p-4 bg-gray-100 border-b border-gray-300">
                    <h2 class="font-bold text-black flex items-center gap-2">
                        <i data-lucide="trophy" class="w-5 h-5 text-black"></i>
                        Riwayat Pemenang
                    </h2>
                </div>
                
                <div id="winner-list" class="flex-1 overflow-y-auto p-4 space-y-3 bg-white">
                    <div class="h-full flex flex-col items-center justify-center text-gray-300 text-center">
                        <i data-lucide="award" class="w-16 h-16 mb-2 stroke-1"></i>
                        <p class="text-xs">Daftar kosong</p>
                    </div>
                </div>
                
                <div class="p-2 bg-black text-center text-[10px] text-white font-medium uppercase tracking-wider">
                    Official Result
                </div>
            </div>

        </div>
    </div>

    <!-- POPUP / MODAL PEMENANG -->
    <div id="winner-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <!-- Overlay Background -->
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        
        <!-- Modal Content -->
        <div class="relative bg-white rounded-2xl shadow-2xl p-8 max-w-lg w-full mx-4 text-center transform scale-90 opacity-0 transition-all duration-300 border-4 border-black" id="modal-content">
            
            <!-- Icon Mahkota -->
            <div class="absolute -top-10 left-1/2 transform -translate-x-1/2 bg-black text-white p-4 rounded-full shadow-xl border-4 border-white">
                <i data-lucide="crown" class="w-10 h-10 animate-bounce-slow"></i>
            </div>

            <h2 class="mt-8 text-xl font-bold text-gray-400 uppercase tracking-widest">Selamat Kepada</h2>
            
            <!-- Nama Pemenang di Modal -->
            <div id="modal-winner-names" class="my-6 space-y-2">
                <!-- Nama akan dirender di sini -->
            </div>

            <div class="mt-8 flex justify-center gap-4">
                <button onclick="closeModal()" class="px-8 py-3 bg-black text-white font-bold rounded-lg hover:bg-gray-800 transition-colors shadow-lg">
                    Tutup & Lanjut
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- Setup Awal ---
        // Data dimulai dari KOSONG sesuai permintaan
        let participants = []; 
        let winners = [];
        let isDrawing = false;
        let animationInterval = null;

        // --- DOM Elements ---
        const participantListEl = document.getElementById('participant-list');
        const winnerListEl = document.getElementById('winner-list');
        const participantCountEl = document.getElementById('participant-count');
        const statRemainingEl = document.getElementById('stat-remaining');
        const statWinnersEl = document.getElementById('stat-winners');
        
        const rollingDisplayEl = document.getElementById('rolling-display');
        const statusTextEl = document.getElementById('status-text');
        
        const newEntryInput = document.getElementById('new-entry');
        const addForm = document.getElementById('add-form');
        const winnerCountInput = document.getElementById('winner-count');
        
        const drawBtn = document.getElementById('draw-btn');
        const resetBtn = document.getElementById('reset-btn');
        const btnText = document.getElementById('btn-text');
        
        // Audio
        const celebrationSound = document.getElementById('celebration-sound');
        celebrationSound.volume = 0.5; // Set volume 50%

        // Modal Elements
        const modalEl = document.getElementById('winner-modal');
        const modalContentEl = document.getElementById('modal-content');
        const modalWinnerNamesEl = document.getElementById('modal-winner-names');

        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => {
            renderAll();
            lucide.createIcons();
        });

        // --- Functions ---

        function addDummyData() {
            const names = ["Andi", "Budi", "Citra", "Dewi", "Eko"];
            participants = [...participants, ...names];
            renderAll();
        }

        function renderAll() {
            renderParticipants();
            renderWinners();
            updateStats();
            lucide.createIcons();
        }

        function updateStats() {
            participantCountEl.textContent = participants.length;
            statRemainingEl.textContent = participants.length;
            statWinnersEl.textContent = winners.length;
            
            // Atur max input
            if (participants.length > 0) {
                winnerCountInput.max = participants.length;
                if(parseInt(winnerCountInput.value) > participants.length) {
                    winnerCountInput.value = participants.length;
                }
            } else {
                winnerCountInput.max = 1;
            }
        }

        function renderParticipants() {
            participantListEl.innerHTML = '';
            
            if (participants.length === 0) {
                participantListEl.innerHTML = `
                    <div class="text-center text-gray-400 text-xs mt-20 px-4 flex flex-col items-center">
                        <i data-lucide="clipboard-list" class="w-8 h-8 mb-2 opacity-30"></i>
                        <p>Data Peserta Kosong.</p>
                        <p>Tambahkan nama pada kolom diatas.</p>
                    </div>`;
                return;
            }

            participants.forEach((name, idx) => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-gray-50 border border-gray-100 px-3 py-2 rounded text-sm hover:bg-gray-100 group transition-colors';
                div.innerHTML = `
                    <span class="truncate font-medium text-gray-700">${idx + 1}. ${name}</span>
                    <button onclick="removeParticipant(${idx})" class="text-gray-300 hover:text-red-600 opacity-0 group-hover:opacity-100 transition-all">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                `;
                participantListEl.appendChild(div);
            });
        }

        function renderWinners() {
            winnerListEl.innerHTML = '';

            if (winners.length === 0) {
                winnerListEl.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-gray-400 text-center opacity-50">
                        <i data-lucide="trophy" class="w-12 h-12 mb-2 stroke-1"></i>
                        <p class="text-xs uppercase tracking-widest">Belum ada hasil</p>
                    </div>`;
                return;
            }

            [...winners].reverse().forEach((winnerObj, idx) => {
                const realIdx = winners.length - idx;
                const div = document.createElement('div');
                div.className = 'flex items-center gap-3 bg-gray-50 p-3 rounded border border-gray-200';
                div.innerHTML = `
                    <div class="bg-black text-white w-6 h-6 rounded flex items-center justify-center font-bold text-xs shrink-0">
                        ${realIdx}
                    </div>
                    <div class="flex flex-col">
                        <span class="font-bold text-gray-900 leading-tight">${winnerObj.name}</span>
                        <span class="text-[10px] text-gray-500">${winnerObj.time}</span>
                    </div>
                `;
                winnerListEl.appendChild(div);
            });
        }

        // --- Actions ---

        addForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = newEntryInput.value.trim();
            if (val) {
                participants.push(val);
                newEntryInput.value = '';
                renderAll();
                newEntryInput.focus();
            }
        });

        window.removeParticipant = (index) => {
            if (isDrawing) return;
            participants.splice(index, 1);
            renderAll();
        };

        resetBtn.addEventListener('click', () => {
            if (confirm("Reset total? Semua data pemenang akan dihapus dan dikembalikan ke daftar peserta.")) {
                // Mengembalikan pemenang ke peserta
                const winnerNames = winners.map(w => w.name);
                participants = [...participants, ...winnerNames].sort();
                winners = [];
                rollingDisplayEl.textContent = "???";
                renderAll();
            }
        });

        // --- Logic Undian & Efek ---

        drawBtn.addEventListener('click', () => {
            const countToWin = parseInt(winnerCountInput.value) || 1;

            if (participants.length === 0) {
                alert("Mohon masukkan nama peserta terlebih dahulu!");
                newEntryInput.focus();
                return;
            }
            if (participants.length < countToWin) {
                alert(`Peserta hanya ${participants.length}, tidak bisa mengambil ${countToWin} pemenang.`);
                return;
            }

            // Start Drawing
            isDrawing = true;
            toggleControls(false);
            statusTextEl.textContent = "MENGACAK...";
            
            // Efek UI
            let speed = 50;
            
            // Loop Animasi Nama
            animationInterval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * participants.length);
                rollingDisplayEl.textContent = participants[randomIndex];
            }, speed);

            // Stop setelah 2.5 detik
            setTimeout(() => {
                finishDraw(countToWin);
            }, 2500);
        });

        function finishDraw(count) {
            clearInterval(animationInterval);
            
            // Algoritma Fisher-Yates Shuffle
            const shuffled = [...participants].sort(() => 0.5 - Math.random());
            
            const selectedWinners = shuffled.slice(0, count);
            const remainingParticipants = shuffled.slice(count);

            // Update Data
            const timestamp = new Date().toLocaleTimeString();
            const newWinners = selectedWinners.map(name => ({ name, time: timestamp }));
            
            winners = [...winners, ...newWinners];
            participants = remainingParticipants;

            // UI Updates
            rollingDisplayEl.textContent = selectedWinners[0]; // Tampilkan 1 di layar utama
            if(selectedWinners.length > 1) {
                statusTextEl.textContent = `+ ${selectedWinners.length - 1} LAINNYA`;
            } else {
                statusTextEl.textContent = "PEMENANG TERPILIH";
            }
            
            renderAll();
            isDrawing = false;
            toggleControls(true);

            // --- TRIGGER EFEK SPESIAL ---
            playSound();
            triggerConfetti();
            showModal(selectedWinners);
        }

        // --- Efek Suara, Modal, Confetti ---

        function playSound() {
            celebrationSound.currentTime = 0;
            celebrationSound.play().catch(e => console.log("Audio play failed (user interaction needed first)", e));
        }

        function triggerConfetti() {
            const duration = 3000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#000000', '#333333', '#888888'] // Confetti Monokrom
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#000000', '#333333', '#888888']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function showModal(winnerList) {
            const namesHtml = winnerList.map(name => 
                `<div class="text-3xl md:text-4xl font-black text-black py-2 border-b border-gray-100 last:border-0">${name}</div>`
            ).join('');
            
            modalWinnerNamesEl.innerHTML = namesHtml;
            
            modalEl.classList.remove('hidden');
            // Sedikit delay agar transisi CSS jalan
            setTimeout(() => {
                modalContentEl.classList.remove('scale-90', 'opacity-0');
                modalContentEl.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        window.closeModal = () => {
            modalContentEl.classList.remove('scale-100', 'opacity-100');
            modalContentEl.classList.add('scale-90', 'opacity-0');
            
            setTimeout(() => {
                modalEl.classList.add('hidden');
                // Stop audio jika masih main
                celebrationSound.pause();
                celebrationSound.currentTime = 0;
            }, 300);
        };

        function toggleControls(enable) {
            drawBtn.disabled = !enable;
            resetBtn.disabled = !enable;
            addForm.querySelector('button').disabled = !enable;
            newEntryInput.disabled = !enable;
            
            if (!enable) {
                btnText.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> MENGUNDI...`;
            } else {
                btnText.innerHTML = `<i data-lucide="shuffle" class="w-5 h-5"></i> MULAI UNDIAN`;
            }
            lucide.createIcons();
        }

    </script>
</body>
</html>
